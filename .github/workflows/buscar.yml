name: Buscar clássicos

on:
  schedule:
    # 00:07 e 12:07 em Brasília (UTC-3 = 03:07 e 15:07 UTC).
    # Evitei o minuto :00 porque o GitHub atrasa tarefas nesse horário.
    - cron: "7 3,15 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "buscar = busca, avisa e publica | testar = só mostra o log de cada cinema"
        type: choice
        options: [buscar, testar]
        default: buscar

permissions:
  contents: write

concurrency:
  group: buscar-classicos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODO: ${{ github.event.inputs.modo || 'buscar' }}
        run: |
          if [ "$MODO" = "testar" ]; then
            python -m cinema_classicos --testar
          else
            python -m cinema_classicos
          fi

      - name: Publicar página
        if: ${{ github.event.inputs.modo != 'testar' }}
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A docs dados
          if git diff --cached --quiet; then
            echo "Sem mudanças para publicar."
            exit 0
          fi
          git commit -m "Atualiza programação"
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then
              echo "Publicado."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não consegui publicar após 3 tentativas."
          exit 1
